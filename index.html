<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="index,follow">
<meta name="description" content="にくきゅう（@29KYU_PT）— リハビリ専門職が現場のためのアプリを作っています。">
<title>にくきゅう 🐾 — リハビリ専門職の個人開発</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Segoe UI", Roboto, sans-serif;
    line-height: 1.75;
    color: #1c1c1e;
    background: #f7f7f5;
    margin: 0;
    padding: 0;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 48px 20px 64px; }
  header.title { text-align: center; margin-bottom: 32px; }
  .paw { font-size: 2.4rem; line-height: 1; }
  h1 { font-size: 1.4rem; margin: 12px 0 4px; }
  .meta { color: #6b6b70; font-size: 0.92rem; margin: 2px 0; }
  .links { display: flex; flex-direction: column; gap: 14px; margin-top: 28px; }
  a.card {
    display: block;
    background: #fff;
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 14px;
    padding: 16px 18px;
    text-decoration: none;
    color: inherit;
    transition: transform 0.06s ease;
  }
  a.card:active { transform: scale(0.985); }
  .card b { display: block; font-size: 1.02rem; color: #2a7d72; }
  .card span { font-size: 0.88rem; color: #6b6b70; }
  .card.soon {
    background: transparent;
    border-style: dashed;
    pointer-events: none;
  }
  .card.soon b { color: #9a9aa0; }
  .badge {
    display: inline-block;
    font-size: 0.72rem;
    color: #9a9aa0;
    border: 1px solid rgba(0,0,0,0.12);
    border-radius: 999px;
    padding: 0 8px;
    margin-left: 6px;
    vertical-align: 1px;
  }
  footer { text-align: center; margin-top: 40px; font-size: 0.82rem; color: #6b6b70; }
  footer a { color: #2a7d72; }
  @media (prefers-color-scheme: dark) {
    body { color: #ececec; background: #161618; }
    a.card { background: #1f1f22; border-color: rgba(255,255,255,0.08); }
    .card b { color: #5fb8ac; }
    .card.soon { background: transparent; }
    .badge { border-color: rgba(255,255,255,0.15); }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="title">
    <div class="paw">🐾</div>
    <h1>にくきゅう</h1>
    <p class="meta">リハビリ専門職 × 個人開発</p>
    <p class="meta">現場で「あったらいいのに」を、自分で作っています。</p>
  </header>

  <nav class="links">
    <a class="card" href="https://x.com/29KYU_PT">
      <b>𝕏 @29KYU_PT</b>
      <span>毎日ここにいます。作っている過程も、現場の気づきも。</span>
    </a>
    <div class="card soon">
      <b>📱 リハビリカレンダー（reha_calender）<span class="badge">準備中</span></b>
      <span>リハ職の勤務・予定管理アプリ。App Store 公開に向けて準備中です。</span>
    </div>
    <div class="card soon">
      <b>📝 note<span class="badge">準備中</span></b>
      <span>長めの文章はこちらに置く予定です。</span>
    </div>
    <a class="card" href="/privacy/">
      <b>🔒 プライバシーポリシー</b>
      <span>reha_calender のプライバシーポリシー（日本語 / English）</span>
    </a>
  </nav>

  <footer>
    <p>© にくきゅう（@29KYU_PT）</p>
  </footer>
</div>
</body>
</html>
